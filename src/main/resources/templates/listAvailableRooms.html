<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tillgängliga rum</title>
</head>
<body>


<form th:action="@{/rooms}" method="get">
    <button><</button>
</form>

<form th:action="@{/rooms/available-rooms}" method="post">


    <label for="room">Välj typ av rum:</label>

    <select name="isDoubleRoom" id="room">
        <option value="false">Enkelrum</option>
        <option value="true">Dubbelrum</option>
    </select>

    <br><br>

    <label for="startDate">Startdatum:</label>
    <input type="date" id="startDate" name="startDate">

    <br><br>

    <label for="endDate">Slutdatum:</label>
    <input type="date" id="endDate" name="endDate">

    <br><br>

    <button type="submit">Sök</button>

    <h3 th:if="${availableRooms != null}" th:text="${startDate} + ' till ' + ${endDate}"></h3>

</form>

<p th:if="${error}" th:text="${error}" style="color: red;"></p>


<table>
    <tr>
        <th th:if="${availableRooms != null}" th:text="'Rumnummer'"></th>
        <th th:if="${availableRooms != null}" th:text="'Typ av rum'"></th>
    </tr>
    <tr th:each="room : ${availableRooms}">
        <td th:text="${room.nr}"></td>
        <td th:text="${room.doubleRoom} ? 'Dubbelrum' : 'Enkelrum'"></td>
    </tr>
</table>


</body>
</html>
