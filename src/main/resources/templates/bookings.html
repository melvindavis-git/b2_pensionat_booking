<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bokningar</title>
</head>
<body>

<h1>Bokningar</h1>

<table>
  <tr>
    <th>ID</th>
    <th>Rum</th>
    <th>Kund</th>
    <th>Startdatum</th>
    <th>Slutdatum</th>
  </tr>
  <tr th:each="booking : ${bookings}">
    <td th:text="${booking.id}"></td>
    <td th:text="${booking.room.nr}"></td>
    <td th:text="${booking.customer.name}"></td>
    <td th:text="${booking.startDate}"></td>
    <td th:text="${booking.endDate}"></td>
  </tr>
</table>

</body>
</html>
